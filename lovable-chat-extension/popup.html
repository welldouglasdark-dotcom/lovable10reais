<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lovable Pro Chat Assistant</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- Header com Logo Lovable 10 Reais / Pro -->
        <div class="header">
            <div class="header-brand">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="#FF3366" stroke="#FF3366" stroke-width="2">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.78-8.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>Lovable <span class="pro-tag">PRO</span></h1>
                    <span class="sub-tag">20 AGENTES IA • R$ 10</span>
                </div>
            </div>

            <div class="project-info">
                <span id="projectId">Carregando projeto...</span>
            </div>
        </div>

        <!-- Chat Messages Container -->
        <div class="chat-container" id="chatContainer">
            <div class="messages" id="messages">
                <!-- Mensagens são renderizadas dinamicamente aqui -->
            </div>
        </div>

        <!-- Preview de Arquivos em Anexo -->
        <div class="file-preview" id="filePreview" style="display: none;">
            <!-- Previews de arquivo inseridos aqui -->
        </div>

        <!-- Área de Entrada de Mensagens -->
        <div class="input-container">
            <div class="input-wrapper">
                <textarea 
                    id="messageInput" 
                    placeholder="Digite sua instrução para o Lovable..."
                    rows="3"
                ></textarea>
                <div class="button-group">
                    <button id="attachButton" class="attach-btn" title="Anexar arquivo ou imagem">
                        📎
                    </button>
                    <input 
                        type="file" 
                        id="fileInput" 
                        multiple 
                        accept="image/*,.pdf,.doc,.docx,.txt,.js,.ts,.jsx,.tsx,.json,.css,.html"
                        style="display: none;"
                    />
                    <button id="sendButton" class="send-btn" title="Enviar para o Lovable">
                        ➤
                    </button>
                </div>
            </div>
        </div>

        <!-- Barra de Status do Sistema -->
        <div class="status-bar" id="statusBar">Conectando...</div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
